name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify version
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(sed -n 's/^readonly GOREC_VERSION="\([^"]*\)"/\1/p' lib/common.sh)"
          test "$actual" = "$expected"
      - name: Tests
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          bash -n gorec install.sh tests/*.sh lib/*.sh
          shellcheck -x gorec install.sh tests/*.sh lib/*.sh
          bash tests/smoke.sh
          bash tests/lifecycle.sh
          bash tests/xray.sh
          bash tests/ui.sh
          bash tests/manager-update.sh
          bash tests/platform.sh
      - name: Build release bundle
        run: |
          mkdir dist
          bundle="gorec-manager-${GITHUB_REF_NAME}"
          mkdir "dist/$bundle"
          git archive HEAD | tar -x -C "dist/$bundle"
          tar -C dist -czf "dist/${bundle}.tar.gz" "$bundle"
          rm -rf "dist/$bundle"
          cd dist
          sha256sum "gorec-manager-${GITHUB_REF_NAME}.tar.gz" > "gorec-manager-${GITHUB_REF_NAME}.tar.gz.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
